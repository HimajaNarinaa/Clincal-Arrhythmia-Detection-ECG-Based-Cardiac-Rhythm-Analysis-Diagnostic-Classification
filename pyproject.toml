[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecg-cross-dataset-arrhythmia"
version = "0.1.0"
description = "Patient-independent ECG beat classification and cross-dataset evaluation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.7",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "torch>=2.1",
    "wfdb>=4.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
ecg-arrhythmia = "ecg_arrhythmia.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
